<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taiyari</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2753D8">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;600;700&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EAF0F7;--card:#fff;--ink:#17233A;--mute:#5B6B85;--line:#C9D4E4;--blue:#2753D8;--ok:#1B8A57;--bad:#C4352B;--okbg:#DFF3E8;--badbg:#FADFDC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1726;--card:#18233A;--ink:#E7EDF8;--mute:#9AA9C4;--line:#2C3B58;--blue:#7A9BFF;--ok:#4CC38A;--bad:#FF7D72;--okbg:#14382B;--badbg:#42201D}}
:root[data-theme="dark"]{--bg:#0F1726;--card:#18233A;--ink:#E7EDF8;--mute:#9AA9C4;--line:#2C3B58;--blue:#7A9BFF;--ok:#4CC38A;--bad:#FF7D72;--okbg:#14382B;--badbg:#42201D}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind','Hind Siliguri',system-ui,sans-serif;font-size:17px;line-height:1.5}
#app{max-width:480px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;font-weight:700}
p{margin:0}.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:4px 14px;font-weight:600}
.big{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;font-size:22px;font-weight:700;text-align:left}
.sub{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;text-align:left}
.sub b{display:block;font-size:19px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 22px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.q{font-size:21px;font-weight:600;margin-bottom:18px}
.opt{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-align:left}
.opt .o{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.sel .o{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .o{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .o{background:var(--bad);border-color:var(--bad);color:#fff}
.cta{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:18px;margin-top:14px}
.cta.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
:root:not([data-theme="light"]) .cta{color:#fff}
.score{font-size:64px;font-weight:700;line-height:1;margin:18px 0 6px}
.link{background:none;border:0;color:var(--mute);font-weight:600;padding:6px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.note{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 16px 6px 36px;margin:14px 0 0}.note li{margin-bottom:12px}
.rv{background:var(--card);border:2px solid var(--line);border-left-width:6px;border-radius:12px;padding:12px 14px;margin-top:12px}.rv.good{border-left-color:var(--ok)}.rv.miss{border-left-color:var(--bad)}.rv p{margin:0 0 4px}.q2{font-weight:600;font-size:18px;margin:2px 0 8px!important}.why{margin-top:8px!important;color:var(--mute)}h2{font-size:21px;margin:26px 0 0}
.grp{display:flex;gap:8px;align-items:center}.inp{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-top:12px}.err{color:var(--bad);font-weight:600;margin:10px 0 0}.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--mute)}.stc b{display:block;font-size:28px;color:var(--ink)}
.lbl{display:block;margin-top:18px;font-weight:600}.demo{background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:10px 14px;margin-top:14px}
</style>
</head>

function mk(t,right,wrong,e){var o=shuf([String(right)].concat(wrong.map(String)));return {t:t,o:[o],a:o.indexOf(String(right)),e:e}}

 }else if(sc==="home"){
  h=hdr('<span class="logo">'+LOGO+'<span>'+AN[l]+'</span></span>')+'<h1>'+t("exams")+'</h1><p class="mute">'+t("esub")+'</p>';
  E.forEach(function(e){h+=card("openEx(\'"+e.id+"\')",e.ic,e.n[l],e.live?e.d[l]:t("soon"))});h+=card("goMN()","✎",t("mn"),t("mnd"));
 }else if(sc==="exam"){
  var ex=E.filter(function(x){return x.id===st.ex})[0];
  h=hdr(bk("goHome",t("allex")))+'<h1>'+ex.n[l]+'</h1>';
  if(ex.live){h+='<p class="mute">'+t("sub")+'</p>';S.forEach(function(s){h+=card("openSubj(\'"+s.id+"\')",s.ic,s.n[l],QN+" "+t("qs"))})}
  else h+='<p class="mute">'+t("soonh")+'</p><p style="margin-top:12px">'+t("soonp")+'</p><button class="cta" onclick="openEx(\'ssc\')">'+t("trySsc")+'</button>';
 }else if(sc==="subj"){
  h=hdr(bk("goExam",t("allex").replace(/.*/,t("home"))))+'<h1>'+st.s.n[l]+'</h1>'+card("showNotes()","✎",t("notes"),t("nh"))+card("startQuiz()","✓",t("prac"),QN+" "+t("qs"));
 }else if(sc==="notes"){
  h=hdr(bk(st.nq?"goMN":"goSubj",st.s.n[l]))+'<h1>'+t("nh")+'</h1><ul class="note">';
  st.s.nt[l].forEach(function(x){h+='<li>'+x+'</li>'});h+='</ul><button class="cta" onclick="startQuiz()">'+t("prac")+'</button>';
 }else if(sc==="quiz"){
  var q=st.qs[st.i],n=st.qs.length,o=q.o[l]||q.o[0],cur=st.ans[st.i];
  h=hdr(bk(st.nq?"goMN":"goSubj",st.s.n[l]))+'<p class="mute">'+t("q")+' '+(st.i+1)+' '+t("of")+' '+n+'</p><div class="bar"><i style="width:'+(st.i/n*100)+'%"></i></div><div class="q">'+q.t[l]+'</div>';
  o.forEach(function(x,k){h+='<button class="opt'+(cur===k?' sel':'')+'" onclick="pickOpt('+k+')"><span class="o">'+"ABCD".charAt(k)+'</span><span>'+x+'</span></button>'});
  if(cur!==undefined)h+='<button class="cta" onclick="next()">'+(st.i<n-1?t("next"):t("see"))+'</button>';
 }else{
  var n=st.qs.length,pts=0;st.qs.forEach(function(q,k){if(st.ans[k]===q.a)pts++});
  h=hdr('<span class="chip">'+st.s.n[l]+'</span>')+'<h1>'+t("done")+'</h1><p class="mute">'+t("you")+'</p><div class="score">'+pts+' / '+n+'</div><p class="mute">'+(st.user?"✓ "+t("sv"):t("lg2")+' <button class="link" onclick="acct()">'+t("lb")+'</button>')+'</p><h2>'+t("rev")+'</h2>';
  h+=revList(st.qs,st.ans,l);
  h+='<button class="cta" onclick="startQuiz()">'+t("retry")+'</button><button class="cta alt" onclick="'+(st.nq?'goMN':'goExam')+'()">'+(st.nq?t("mn"):t("home"))+'</button>';
 }
 
app.innerHTML=h+'<p class="mute" style="font-size:13px;margin-top:28px">Taiyari v8</p>';document.documentElement.lang=LN[l];window.scrollTo(0,0);
}
draw();
if(st.sess)syncDown().then(function(){if(["home","exam","subj","prog","mn"].indexOf(st.scr)>-1)draw()}).catch(function(){});
</script>
