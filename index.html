:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#EAF0F7;--card:#fff;--ink:#17233A;--mute:#5B6B85;--line:#C9D4E4;--blue:#2753D8;--ok:#1B8A57;--bad:#C4352B;--okbg:#DFF3E8;--badbg:#FADFDC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1726;--card:#18233A;--ink:#E7EDF8;--mute:#9AA9C4;--line:#2C3B58;--blue:#7A9BFF;--ok:#4CC38A;--bad:#FF7D72;--okbg:#14382B;--badbg:#42201D}}
:root[data-theme="dark"]{--bg:#0F1726;--card:#18233A;--ink:#E7EDF8;--mute:#9AA9C4;--line:#2C3B58;--blue:#7A9BFF;--ok:#4CC38A;--bad:#FF7D72;--okbg:#14382B;--badbg:#42201D}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind','Hind Siliguri',system-ui,sans-serif;font-size:17px;line-height:1.5}
#app{max-width:480px;margin:0 auto;padding:20px 18px 40px;min-height:100vh}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;font-weight:700}
p{margin:0}.mute{color:var(--mute)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:4px 14px;font-weight:600}
.big{display:block;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;font-size:22px;font-weight:700;text-align:left}
.sub{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;text-align:left}
.sub b{display:block;font-size:19px}
.ico{flex:none;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 22px}
.bar i{display:block;height:100%;background:var(--blue);transition:width .25s}
.q{font-size:21px;font-weight:600;margin-bottom:18px}
.opt{display:flex;gap:14px;align-items:center;width:100%;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;text-align:left}
.opt .o{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--mute);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt.sel .o{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok .o{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{background:var(--badbg);border-color:var(--bad)}.opt.bad .o{background:var(--bad);border-color:var(--bad);color:#fff}
.cta{display:block;width:100%;background:var(--blue);color:#fff;border:0;border-radius:12px;padding:14px;font-weight:700;font-size:18px;margin-top:14px}
.cta.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
:root:not([data-theme="light"]) .cta{color:#fff}
.score{font-size:64px;font-weight:700;line-height:1;margin:18px 0 6px}
.link{background:none;border:0;color:var(--mute);font-weight:600;padding:6px 0}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.note{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px 16px 6px 36px;margin:14px 0 0}.note li{margin-bottom:12px}
.rv{background:var(--card);border:2px solid var(--line);border-left-width:6px;border-radius:12px;padding:12px 14px;margin-top:12px}.rv.good{border-left-color:var(--ok)}.rv.miss{border-left-color:var(--bad)}.rv p{margin:0 0 4px}.q2{font-weight:600;font-size:18px;margin:2px 0 8px!important}.why{margin-top:8px!important;color:var(--mute)}h2{font-size:21px;margin:26px 0 0}
.grp{display:flex;gap:8px;align-items:center}.inp{width:100%;font:inherit;padding:14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-top:12px}.err{color:var(--bad);font-weight:600;margin:10px 0 0}.stg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.stc{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px;color:var(--mute)}.stc b{display:block;font-size:28px;color:var(--ink)}
.lbl{display:block;margin-top:18px;font-weight:600}.demo{background:var(--okbg);border:2px solid var(--ok);border-radius:12px;padding:10px 14px;margin-top:14px}
.ld i{animation:ldp 1.4s ease-in-out infinite alternate}@keyframes ldp{from{width:12%}to{width:96%}}@media (prefers-reduced-motion:reduce){.ld i{animation:none;width:60%}}
/* v13 look: OMR-sheet identity, rounded display type, tinted accents */
:root{--bg:#F2F5FB;--card:#fff;--ink:#14213D;--mute:#5A6785;--line:#DCE3F0;--blue:#2753D8;--btn:#2753D8;--hero:#1B2470;--ring:rgba(39,83,216,.2);--sh:0 1px 2px rgba(20,33,61,.06),0 12px 24px -16px rgba(20,33,61,.3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1424;--card:#172036;--ink:#E8EEFA;--mute:#9CABC8;--line:#27324D;--blue:#7C9CFF;--btn:#4468F0;--hero:#26338F;--ring:rgba(124,156,255,.3);--sh:none}}
:root[data-theme="dark"]{--bg:#0E1424;--card:#172036;--ink:#E8EEFA;--mute:#9CABC8;--line:#27324D;--blue:#7C9CFF;--btn:#4468F0;--hero:#26338F;--ring:rgba(124,156,255,.3);--sh:none}
h1,h2,.logo,.av{font-family:'Baloo 2','Hind','Hind Siliguri',system-ui,sans-serif}
h1{font-size:31px;line-height:1.12;letter-spacing:-.01em;margin:0 0 8px}
h2{font-size:22px;margin:26px 0 2px}
.top{margin-bottom:20px}
.chip{border:1px solid var(--line);padding:6px 14px;box-shadow:var(--sh)}
.av{width:42px;height:42px;border:0;border-radius:50%;background:var(--btn);color:#fff;font-size:19px;font-weight:700;display:grid;place-items:center;padding:0}
.sub,.big,.note,.rv,.stc,.inp{border:1px solid var(--line);box-shadow:var(--sh)}
.rv{border-left-width:6px}
.sub{border-radius:20px;padding:14px 16px}
.sub b,.tile b{font-family:'Baloo 2','Hind','Hind Siliguri',system-ui,sans-serif;font-weight:700}
.sub b{font-size:20px;line-height:1.2}
.ico{width:48px;height:48px;border-radius:15px;background:var(--abg,rgba(39,83,216,.13));color:var(--a,var(--blue));font-family:'Baloo 2','Hind',sans-serif;font-size:22px}
.sub:active,.tile:active,.hero:active,.opt:active,.cta:active{transform:scale(.985)}
.sub,.tile,.hero,.opt,.cta{transition:transform .12s}
.cta{background:var(--btn);border-radius:16px;padding:15px;box-shadow:0 10px 20px -12px var(--btn)}
:root .cta.alt,:root:not([data-theme="light"]) .cta.alt{background:transparent;box-shadow:none;border:1.5px solid var(--line);color:var(--ink)}
.bar{height:10px;border-radius:6px;margin:8px 0 20px}.bar i{background:var(--btn);border-radius:6px}
.q{line-height:1.35}
.opt{border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--sh)}
.opt .o{font-family:'Baloo 2','Hind',sans-serif}
.opt.sel{border-color:var(--blue);box-shadow:0 0 0 3px var(--ring)}
.opt.sel .o{background:var(--btn);border-color:var(--btn)}
.hero{display:block;width:100%;text-align:left;color:#fff;border:0;border-radius:24px;padding:18px 18px 16px;margin-top:14px;position:relative;overflow:hidden;background-color:var(--hero);background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.2) 1.6px,transparent 2.2px);background-size:20px 20px}
.hero::after{content:"";position:absolute;right:-36px;top:-36px;width:124px;height:124px;border-radius:50%;border:16px solid rgba(255,255,255,.13)}
.hero b{display:block;font:700 25px/1.15 'Baloo 2','Hind','Hind Siliguri',system-ui,sans-serif;margin:6px 0 4px;position:relative}
.hero .d{display:block;opacity:.9;max-width:28ch;position:relative}
.hgo{display:inline-block;margin-top:12px;background:#fff;color:var(--hero);font-weight:700;border-radius:999px;padding:8px 18px;position:relative}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:12px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--sh);min-height:132px}
.tile .ico{width:44px;height:44px;font-size:20px}
.tile b{display:block;font-size:20px;line-height:1.15}
.tile small{display:block;color:var(--mute);font-size:14px;line-height:1.3;margin-top:2px}
.tile.soon{opacity:.7}.tile.soon .ico{filter:saturate(.45)}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px 16px;box-shadow:var(--sh)}
.wk{display:flex;justify-content:space-between;gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--mute);min-width:34px}
.wd i{display:block;position:relative;width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.wd.on i{background:var(--btn);border-color:var(--btn)}
.wd.on i::after{content:"";position:absolute;left:8px;top:3px;width:6px;height:12px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.wd.td{color:var(--ink);font-weight:700}.wd.td i{border-color:var(--blue)}.wd.td.on i{border-color:var(--btn)}
.stk{margin-top:10px;display:flex;align-items:baseline;gap:8px;color:var(--mute)}
.sn{font:700 32px/1 'Baloo 2','Hind',sans-serif;color:var(--ink)}
.ring{position:relative;width:148px;height:148px;margin:10px 0 2px}
.rn{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rn b{font:700 46px/1 'Baloo 2','Hind',sans-serif}.rn span{color:var(--mute);font-weight:600}
.msg{font:700 21px/1.2 'Baloo 2','Hind','Hind Siliguri',system-ui,sans-serif;margin:6px 0 4px}
@media (prefers-reduced-motion:reduce){.sub,.tile,.hero,.opt,.cta{transition:none}.sub:active,.tile:active,.hero:active,.opt:active,.cta:active{transform:none}}
.mdl{position:fixed;inset:0;z-index:50;background:rgba(10,15,30,.55);display:grid;place-items:end center;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:520px){.mdl{place-items:center}}
.dlg{width:100%;max-width:420px;background:var(--card);color:var(--ink);border-radius:24px;padding:20px;box-shadow:0 24px 60px -20px rgba(0,0,0,.55)}
.dlg h2{margin:0 0 6px}.dbt{display:flex;gap:10px;margin-top:16px}.dbt .cta{margin-top:0;flex:1}
.qh{display:flex;justify-content:space-between;align-items:center}
.tm{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px}.tm.warn{color:var(--bad);border-color:var(--bad)}
/* v18: on-brand loader (OMR bubbles shade in), dimmed unavailable subjects */
.ldv{min-height:60vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:12px 0}
.omr{display:flex;gap:14px;margin-bottom:22px}
.omr span{width:54px;height:54px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:700 22px 'Baloo 2','Hind',sans-serif;color:var(--mute);animation:omrf 2.4s ease-in-out infinite}
.omr span:nth-child(2){animation-delay:.3s}.omr span:nth-child(3){animation-delay:.6s}.omr span:nth-child(4){animation-delay:.9s}
@keyframes omrf{0%,10%{background:transparent;border-color:var(--line);color:var(--mute);transform:scale(1)}25%,55%{background:var(--btn);border-color:var(--btn);color:#fff;transform:scale(1.1)}80%,100%{background:transparent;border-color:var(--line);color:var(--mute);transform:scale(1)}}
.ldv h1{font-size:27px;max-width:17ch;margin:0 0 10px}
.ldt{min-height:3.4em;max-width:30ch;margin:0 0 14px}
.ldv .cta{width:auto;padding:12px 28px}
.sub.soon{opacity:.66}
@media (prefers-reduced-motion:reduce){.omr span{animation:none}.omr span:first-child{background:var(--btn);border-color:var(--btn);color:#fff}}
</style>
